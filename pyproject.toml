[project]
name = "medium-archive"
version = "0.1.0"
description = "Archive a Medium publication as raw HTML plus a Markdown conversion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "beautifulsoup4",
    "markdownify",
    "lxml",
    # the pelican exporter writes YAML front matter; its generated
    # config reads it back
    "pyyaml",
]

[project.optional-dependencies]
# card-cover thumbnails in the hugo and pelican exporters
covers = ["pillow"]

[project.scripts]
medium-archive = "medium_archive.cli:main"

[dependency-groups]
# markdown-it-py, mdit-py-plugins and pygments are what the
# generated pelican config reads Markdown with; the tests read that
# config the way a pelican build does
dev = ["pytest", "pillow", "markdown-it-py", "mdit-py-plugins",
       "pygments"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
