43e17587"},"NewsletterV3:2353e5867157":{"__typename":"NewsletterV3","id":"2353e5867157","type":"NEWSLETTER_TYPE_AUTHOR","slug":"4f143e17587","name":"4f143e17587","collection":null,"user":{"__ref":"User:4f143e17587"}},"User:4f143e17587":{"__typename":"User","id":"4f143e17587","name":"QuantStack","username":"QuantStack","newsletterV3":{"__ref":"NewsletterV3:2353e5867157"},"linkedAccounts":{"__ref":"LinkedAccounts:4f143e17587"},"isSuspended":false,"customDomainState":null,"hasSubdomain":false,"imageId":"0*gzuphiVjSDZno9vi.jpg","verifications":{"__typename":"VerifiedInfo","isBookAuthor":false},"bio":"Open-source software, scientific computing, education technology","socialStats":{"__typename":"SocialStats","followerCount":1487,"followingCount":2,"collectionFollowingCount":1},"allowNotes":true,"membership":null,"viewerEdge":{"__ref":"UserViewerEdge:userId:4f143e17587-viewerId:lo_ca13545b2aff"},"twitterScreenName":"QuantStack"},"Paragraph:83831166c231_0":{"__typename":"Paragraph","id":"83831166c231_0","name":"9b9a","type":"H3","href":null,"layout":null,"metadata":null,"text":"And Voilà!","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_1":{"__typename":"Paragraph","id":"83831166c231_1","name":"152d","type":"P","href":null,"layout":null,"metadata":null,"text":"… from Jupyter notebooks to standalone applications and dashboards","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"STRONG","start":0,"end":66,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_2":{"__typename":"Paragraph","id":"83831166c231_2","name":"dd1b","type":"P","href":null,"layout":null,"metadata":null,"text":"The goal of Project Jupyter is to improve the workflows of researchers, educators, scientists, and other practitioners of scientific computing, from the exploratory phase of their work to the communication of the results.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"STRONG","start":153,"end":170,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":192,"end":205,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":153,"end":170,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":192,"end":206,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_3":{"__typename":"Paragraph","id":"83831166c231_3","name":"9cf5","type":"P","href":null,"layout":null,"metadata":null,"text":"But interactive notebooks are not the best communication tool for all audiences. While they have proven invaluable to provide a narrative alongside the source, they are not ideal to address non-technical readers, who may be put off by the presence of code cells, or the need to run the notebook to see the results. Finally, following the order as the code often results in the most interesting content to be at the end of the document.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"STRONG","start":190,"end":211,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":415,"end":418,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":128,"end":137,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":190,"end":211,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":415,"end":418,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_4":{"__typename":"Paragraph","id":"83831166c231_4","name":"0326","type":"P","href":null,"layout":null,"metadata":null,"text":"Another challenge with sharing notebooks is the security model. How can we offer the interactivity of a notebook making use of e.g. Jupyter widgets without allowing arbitrary code execution by the end user?","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"STRONG","start":48,"end":56,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":48,"end":56,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_5":{"__typename":"Paragraph","id":"83831166c231_5","name":"a1bf","type":"P","href":null,"layout":null,"metadata":null,"text":"We set ourselves to solve these challenges, and we are happy to announce the first release of Voilà.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"STRONG","start":94,"end":99,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":94,"end":99,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_6":{"__typename":"Paragraph","id":"83831166c231_6","name":"69b5","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__typename":"ImageMetadata","id":"1*c1xwFRqy99o8nLVxDSqNZg.png","originalHeight":418,"originalWidth":1000,"focusPercentX":null,"focusPercentY":null,"alt":null},"text":"","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_7":{"__typename":"Paragraph","id":"83831166c231_7","name":"c0a9","type":"P","href":null,"layout":null,"metadata":null,"text":"Voilà turns Jupyter notebooks into standalone web applications.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"STRONG","start":0,"end":5,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":0,"end":5,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_8":{"__typename":"Paragraph","id":"83831166c231_8","name":"89c1","type":"ULI","href":null,"layout":null,"metadata":null,"text":"Voilà supports Jupyter interactive widgets, including the roundtrips to the kernel.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"STRONG","start":15,"end":42,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":15,"end":42,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_9":{"__typename":"Paragraph","id":"83831166c231_9","name":"f7d9","type":"ULI","href":null,"layout":null,"metadata":null,"text":"Voilà does not permit arbitrary code execution by consumers of dashboards.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"STRONG","start":6,"end":46,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":6,"end":46,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_10":{"__typename":"Paragraph","id":"83831166c231_10","name":"0713","type":"ULI","href":null,"layout":null,"metadata":null,"text":"Built upon Jupyter standard protocols and file formats, Voilà works with any Jupyter kernel (C++, Python, Julia), making it a language-agnostic dashboarding system.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"STRONG","start":126,"end":143,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":126,"end":143,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_11":{"__typename":"Paragraph","id":"83831166c231_11","name":"95d4","type":"ULI","href":null,"layout":null,"metadata":null,"text":"Voilà is extensible. It includes a flexible template system to produce rich application layouts.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"STRONG","start":44,"end":59,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":44,"end":59,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_12":{"__typename":"Paragraph","id":"83831166c231_12","name":"76cb","type":"H3","href":null,"layout":null,"metadata":null,"text":"Installation and first-time use","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"STRONG","start":0,"end":31,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_13":{"__typename":"Paragraph","id":"83831166c231_13","name":"25b9","type":"P","href":null,"layout":null,"metadata":null,"text":"Voilà can be installed from pypi:","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_14":{"__typename":"Paragraph","id":"83831166c231_14","name":"6a16","type":"PRE","href":null,"layout":null,"metadata":null,"text":"pip install voila","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_15":{"__typename":"Paragraph","id":"83831166c231_15","name":"9d2b","type":"P","href":null,"layout":null,"metadata":null,"text":"or conda-forge:","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_16":{"__typename":"Paragraph","id":"83831166c231_16","name":"eb22","type":"PRE","href":null,"layout":null,"metadata":null,"text":"conda install voila -c conda-forge","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_17":{"__typename":"Paragraph","id":"83831166c231_17","name":"48b9","type":"P","href":null,"layout":null,"metadata":null,"text":"Upon installation, several components are installed, one of which is the voila command-line utility. You can try it by typing voila notebook.ipynb. It results in the browser opening to a new tornado application showing markdown cells, rich outputs, and interactive widgets.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"CODE","start":73,"end":78,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"CODE","start":126,"end":146,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_18":{"__typename":"Paragraph","id":"83831166c231_18","name":"6175","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__typename":"ImageMetadata","id":"1*imDFJcYj8k-apbrvIK9ZVQ.gif","originalHeight":1000,"originalWidth":1500,"focusPercentX":null,"focusPercentY":null,"alt":null},"text":"From a notebook to a standalone web application","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_19":{"__typename":"Paragraph","id":"83831166c231_19","name":"1278","type":"P","href":null,"layout":null,"metadata":null,"text":"As you can see in the screencast, Jupyter interactive widgets remain fully functional even when they require computation by the kernel.","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_20":{"__typename":"Paragraph","id":"83831166c231_20","name":"8ae3","type":"P","href":null,"layout":null,"metadata":null,"text":"You can immediately try out some of the command-line options to Voilà","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_21":{"__typename":"Paragraph","id":"83831166c231_21","name":"903d","type":"ULI","href":null,"layout":null,"metadata":null,"text":"with --strip_sources=False, input cells will be included in the resulting web application (as read-only pygment snippets).","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"CODE","start":5,"end":26,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_22":{"__typename":"Paragraph","id":"83831166c231_22","name":"585e","type":"ULI","href":null,"layout":null,"metadata":null,"text":"with --theme=dark, Voilà will make use of the dark JupyterLab theme, which will apply to code cells, widgets and all other visible components.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"CODE","start":5,"end":17,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_23":{"__typename":"Paragraph","id":"83831166c231_23","name":"ec9b","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__typename":"ImageMetadata","id":"1*ce142q3rm3TgJZVNEgGWcw.gif","originalHeight":900,"originalWidth":1500,"focusPercentX":null,"focusPercentY":null,"alt":null},"text":"Making use of the dark theme and including input cells","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_24":{"__typename":"Paragraph","id":"83831166c231_24","name":"087d","type":"P","href":null,"layout":null,"metadata":null,"text":"Note that code is only shown, voilà does not allow users to edit or execute arbitrary code.","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_25":{"__typename":"Paragraph","id":"83831166c231_25","name":"3ec0","type":"H3","href":null,"layout":null,"metadata":null,"text":"Voilà's execution model","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_26":{"__typename":"Paragraph","id":"83831166c231_26","name":"deea","type":"P","href":null,"layout":null,"metadata":null,"text":"The execution model of Voilà is the following: upon connection to a notebook URL, Voilà launches the kernel for that notebook, and runs all the cells as it populates the notebook model with the outputs.","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_27":{"__typename":"Paragraph","id":"83831166c231_27","name":"71fa","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__typename":"ImageMetadata","id":"1*KZj7rmVqAHmY1b-P-QMPLw.png","originalHeight":578,"originalWidth":731,"focusPercentX":null,"focusPercentY":null,"alt":null},"text":"The execution model of Voilà","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_28":{"__typename":"Paragraph","id":"83831166c231_28","name":"82b5","type":"P","href":null,"layout":null,"metadata":null,"text":"After the execution, the associated kernel is not shut down. The notebook is converted to HTML and served to the user. The rendered HTML includes JavaScript that establishes a connection to the kernel. Jupyter interactive widgets referred in cell outputs are rendered and connected to their counterpart in the kernel. The kernel is only shut down when the user closes their browser tab.","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_29":{"__typename":"Paragraph","id":"83831166c231_29","name":"f29c","type":"BQ","href":null,"layout":null,"metadata":null,"text":"The current version of Voilà only responds to the initial GET request when all the cells have finished running, which may take a long time, but there is ongoing work on enabling progressive rendering, which should make it into a release soon.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":153,"end":165,"href":"https:\u002F\u002Fgithub.com\u002FQuantStack\u002Fvoila\u002Fpull\u002F133","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":0,"end":242,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_30":{"__typename":"Paragraph","id":"83831166c231_30","name":"dccf","type":"P","href":null,"layout":null,"metadata":null,"text":"An important aspect of this execution model is that the front-end does not determine what code is run by the backend. In fact, unless specified otherwise (with option --strip-sources=False), the source of the rendered notebook does not even make it to the front-end. The instance of the jupyter_server instantiated by Voilà actually disallows execute requests by default.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"CODE","start":167,"end":188,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"CODE","start":287,"end":301,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_31":{"__typename":"Paragraph","id":"83831166c231_31","name":"7a60","type":"H3","href":null,"layout":null,"metadata":null,"text":"Support for custom interactive widgets","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_32":{"__typename":"Paragraph","id":"83831166c231_32","name":"3090","type":"P","href":null,"layout":null,"metadata":null,"text":"Voilà can render custom Jupyter widget libraries, including (but not limited to) bqplot, ipyleafet, ipyvolume, ipympl, ipysheet, plotly, ipywebrtc, etc.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":81,"end":87,"href":"https:\u002F\u002Fgithub.com\u002Fbloomberg\u002Fbqplot","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":89,"end":98,"href":"https:\u002F\u002Fgithub.com\u002Fjupyter-widgets\u002Fipyleaflet","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":100,"end":109,"href":"https:\u002F\u002Fgithub.com\u002Fmaartenbreddels\u002Fipyvolume","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":111,"end":117,"href":"https:\u002F\u002Fgithub.com\u002Fmatplotlib\u002Fjupyter-matplotlib\u002F","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":119,"end":127,"href":"https:\u002F\u002Fgithub.com\u002FQuantStack\u002Fipysheet","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":129,"end":135,"href":"https:\u002F\u002Fgithub.com\u002Fplotly\u002Fplotly.py","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":137,"end":146,"href":"https:\u002F\u002Fgithub.com\u002Fmaartenbreddels\u002Fipywebrtc","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_33":{"__typename":"Paragraph","id":"83831166c231_33","name":"7c62","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__typename":"ImageMetadata","id":"1*iBz5dUYHT5N9dbymPKTGCg.gif","originalHeight":1000,"originalWidth":1500,"focusPercentX":null,"focusPercentY":null,"alt":null},"text":"Including bqplot figures with Voilà","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":10,"end":16,"href":"https:\u002F\u002Fgithub.com\u002Fbloomberg\u002Fbqplot","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_34":{"__typename":"Paragraph","id":"83831166c231_34","name":"8e29","type":"P","href":null,"layout":null,"metadata":null,"text":"Together with ipympl, Voilà is actually a simple means to render interactive matplotlib figures in a standalone web application:","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":14,"end":20,"href":"https:\u002F\u002Fgithub.com\u002Fmatplotlib\u002Fjupyter-matplotlib\u002F","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_35":{"__typename":"Paragraph","id":"83831166c231_35","name":"b6ee","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__typename":"ImageMetadata","id":"1*e3k8ZgJoCp0Pm-yZ5Xr0Xg.gif","originalHeight":900,"originalWidth":1500,"focusPercentX":null,"focusPercentY":null,"alt":null},"text":"Rendering interactive matplotlib figures in a web application with voilà","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_36":{"__typename":"Paragraph","id":"83831166c231_36","name":"ce36","type":"H3","href":null,"layout":null,"metadata":null,"text":"Voilà is language-agnostic","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_37":{"__typename":"Paragraph","id":"83831166c231_37","name":"f0c6","type":"P","href":null,"layout":null,"metadata":null,"text":"Voilà can be used to produce applications with any Jupyter kernel. The following screencast shows how Voilà can be used to produce a simple dashboard in C++ making use of leaflet.js maps, with the xeus-cling C++ kernel and the xleaflet package.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":197,"end":207,"href":"https:\u002F\u002Fgithub.com\u002FQuantStack\u002Fxeus-cling","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":227,"end":235,"href":"https:\u002F\u002Fgithub.com\u002FQuantStack\u002Fxleaflet","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_38":{"__typename":"Paragraph","id":"83831166c231_38","name":"01fb","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__typename":"ImageMetadata","id":"1*os2ABw7hEnfd1Dq5pOrTDg.gif","originalHeight":900,"originalWidth":1500,"focusPercentX":null,"focusPercentY":null,"alt":null},"text":"A standalone Voilà page making use of the C++ Jupyter kernel, xeus-cling (input cells display enabled).","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":62,"end":72,"href":"https:\u002F\u002Fgithub.com\u002FQuantStack\u002Fxeus-cling","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_39":{"__typename":"Paragraph","id":"83831166c231_39","name":"2f12","type":"P","href":null,"layout":null,"metadata":null,"text":"We hope that Voilà will be a stimulant to other languages (R, Julia, JVM\u002FJava) to provide stronger widgets support.","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_40":{"__typename":"Paragraph","id":"83831166c231_40","name":"3640","type":"H3","href":null,"layout":null,"metadata":null,"text":"Richer layouts with Voilà templates","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_41":{"__typename":"Paragraph","id":"83831166c231_41","name":"6f2d","type":"P","href":null,"layout":null,"metadata":null,"text":"The main extension point to Voilà is the custom template system. The HTML served to the end-user is produced from the notebook model by applying a Jinja template, which can be defined by the user.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"STRONG","start":48,"end":63,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":48,"end":63,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_42":{"__typename":"Paragraph","id":"83831166c231_42","name":"ede5","type":"P","href":null,"layout":null,"metadata":null,"text":"An example template for voilà is the voila-gridstack template, which can be installed from pypi with","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"CODE","start":37,"end":52,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_43":{"__typename":"Paragraph","id":"83831166c231_43","name":"24d3","type":"PRE","href":null,"layout":null,"metadata":null,"text":"pip install voila-gridstack","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_44":{"__typename":"Paragraph","id":"83831166c231_44","name":"c99e","type":"P","href":null,"layout":null,"metadata":null,"text":"You can try it by typing voila notebook.ipynb --template=gridstack.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"CODE","start":25,"end":66,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_45":{"__typename":"Paragraph","id":"83831166c231_45","name":"cf5e","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__typename":"ImageMetadata","id":"1*grVVSeKyw7bXYU7fZmHgQQ.gif","originalHeight":900,"originalWidth":1500,"focusPercentX":null,"focusPercentY":null,"alt":null},"text":"Making use of the Gridstack template to produce a dashboard with bqplot charts","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":65,"end":71,"href":"https:\u002F\u002Fgithub.com\u002Fbloomberg\u002Fbqplot\u002F","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_46":{"__typename":"Paragraph","id":"83831166c231_46","name":"f035","type":"P","href":null,"layout":null,"metadata":null,"text":"The gridstack Voilà template makes use of the cell metadata to lay out the application.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":4,"end":28,"href":"https:\u002F\u002Fgithub.com\u002FQuantStack\u002Fvoila-gridstack\u002F","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_47":{"__typename":"Paragraph","id":"83831166c231_47","name":"24d2","type":"BQ","href":null,"layout":null,"metadata":null,"text":"A roadmap item for the gridstack Voilà template is to support the entire spec for the deprecated jupyter dashboards and to create a WYSIWYG editor for these templates in the form of a JupyterLab extension.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":97,"end":115,"href":"https:\u002F\u002Fgithub.com\u002Fjupyter\u002Fdashboards","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_48":{"__typename":"Paragraph","id":"83831166c231_48","name":"7853","type":"P","href":null,"layout":null,"metadata":null,"text":"Note that voila-gridstack template is still at an early stage of development.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":10,"end":25,"href":"https:\u002F\u002Fgithub.com\u002FQuantStack\u002Fvoila-gridstack\u002F","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_49":{"__typename":"Paragraph","id":"83831166c231_49","name":"f645","type":"H3","href":null,"layout":null,"metadata":null,"text":"How to make custom Voilà templates?","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_50":{"__typename":"Paragraph","id":"83831166c231_50","name":"b317","type":"P","href":null,"layout":null,"metadata":null,"text":"A Voilà template is actually a folder placed in the standard directoryPREFIX\u002Fshare\u002Fjupyter\u002Fvoila\u002Ftemplates and which may include","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"CODE","start":70,"end":106,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":31,"end":37,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":31,"end":37,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_51":{"__typename":"Paragraph","id":"83831166c231_51","name":"8d52","type":"ULI","href":null,"layout":null,"metadata":null,"text":"nbconvert templates (the jinja templates used to transform the notebook into HTML)","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"CODE","start":0,"end":9,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_52":{"__typename":"Paragraph","id":"83831166c231_52","name":"2e9f","type":"ULI","href":null,"layout":null,"metadata":null,"text":"static resources","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"CODE","start":0,"end":6,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_53":{"__typename":"Paragraph","id":"83831166c231_53","name":"2134","type":"ULI","href":null,"layout":null,"metadata":null,"text":"custom tornado templates such as 404.html etc.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"CODE","start":7,"end":14,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"CODE","start":33,"end":41,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_54":{"__typename":"Paragraph","id":"83831166c231_54","name":"44fa","type":"P","href":null,"layout":null,"metadata":null,"text":"All of these are optional. It may also contain a conf.json file to set up which template to use as a base. The directory structure for a Voilà template is the following:","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"CODE","start":49,"end":58,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_55":{"__typename":"Paragraph","id":"83831166c231_55","name":"8beb","type":"PRE","href":null,"layout":null,"metadata":null,"text":"PREFIX\u002Fshare\u002Fjupyter\u002Fvoila\u002Ftemplates\u002Ftemplate_name\u002F\n|\n├── conf.json                # Template configuration file\n├── nbconvert_templates\u002F     # Custom nbconvert templates\n├── static\u002F                  # Static directory\n└── templates\u002F               # Custom tornado templates","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"CODE","start":0,"end":36,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_56":{"__typename":"Paragraph","id":"83831166c231_56","name":"59f1","type":"P","href":null,"layout":null,"metadata":null,"text":"The Voilà template system can be used to completely override the behavior of the front-end. One can make use of modern JavaScript frameworks such as React or Vue.js to produce modern UI including Jupyter widgets and outputs.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":149,"end":154,"href":"https:\u002F\u002Freactjs.org\u002F","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":158,"end":164,"href":"https:\u002F\u002Fvuejs.org\u002F","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_57":{"__typename":"Paragraph","id":"83831166c231_57","name":"64b0","type":"P","href":null,"layout":null,"metadata":null,"text":"Another example template for Voilà is voila-vuetify, which is built upon vue.js:","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"CODE","start":38,"end":51,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_58":{"__typename":"Paragraph","id":"83831166c231_58","name":"6d8c","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__typename":"ImageMetadata","id":"1*HtXNf1rq26u9ss8L-Oo6VQ.gif","originalHeight":900,"originalWidth":1500,"focusPercentX":null,"focusPercentY":null,"alt":null},"text":"The voila-vuetify template makes use of Vue.js","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":4,"end":17,"href":"https:\u002F\u002Fgithub.com\u002FQuantStack\u002Fvoila-vuetify","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_59":{"__typename":"Paragraph","id":"83831166c231_59","name":"1d31","type":"P","href":null,"layout":null,"metadata":null,"text":"The voila-gridstack and voila-vuetify templates are still at an early stage of development, but will be iterated upon quickly in the next weeks as we are exploring templates.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"EM","start":0,"end":174,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_60":{"__typename":"Paragraph","id":"83831166c231_60","name":"5f19","type":"H3","href":null,"layout":null,"metadata":null,"text":"A Jupyter server extension","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_61":{"__typename":"Paragraph","id":"83831166c231_61","name":"45a3","type":"P","href":null,"layout":null,"metadata":null,"text":"Beyond the voila command-line utility, the Voilà package also include a Jupyter server extension, so that Voilà dashboards can be served alongside the Jupyter notebook application.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"CODE","start":11,"end":16,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":80,"end":96,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":80,"end":96,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_62":{"__typename":"Paragraph","id":"83831166c231_62","name":"6884","type":"P","href":null,"layout":null,"metadata":null,"text":"When Voilà is installed, a running Jupyter server will serve the Voilà web application under BASE_URL\u002Fvoila.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"CODE","start":93,"end":107,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_63":{"__typename":"Paragraph","id":"83831166c231_63","name":"daf8","type":"H3","href":null,"layout":null,"metadata":null,"text":"The Jupyter Community Workshop on Dashboarding","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_64":{"__typename":"Paragraph","id":"83831166c231_64","name":"4e21","type":"P","href":null,"layout":null,"metadata":null,"text":"From June 3rd to June 6th 2019, a community workshop on dashboarding with Project Jupyter took place in Paris. Over thirty Jupyter contributors and community members gathered to discuss dashboarding technologies and hack together.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":34,"end":68,"href":"https:\u002F\u002Fblog.jupyter.org\u002Fjupyter-community-workshop-dashboarding-with-project-jupyter-b0e421bdf164","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_65":{"__typename":"Paragraph","id":"83831166c231_65","name":"5a4d","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__typename":"ImageMetadata","id":"1*6LggiPlUoCSkP2A1aHp_3w.jpeg","originalHeight":3456,"originalWidth":4608,"focusPercentX":null,"focusPercentY":null,"alt":null},"text":"The participants to the Paris Jupyter community workshop on dashboarding","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_66":{"__typename":"Paragraph","id":"83831166c231_66","name":"14e8","type":"P","href":null,"layout":null,"metadata":null,"text":"Several dashboarding solutions such as Dash and Panel were presented during the workshop and featured at the PyData Paris Meetup which was organized on the same week.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":109,"end":128,"href":"https:\u002F\u002Fwww.meetup.com\u002FPyData-Paris\u002Fevents\u002F261452824\u002F","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_67":{"__typename":"Paragraph","id":"83831166c231_67","name":"914b","type":"P","href":null,"layout":null,"metadata":null,"text":"The workshop was also the occasion for several contributors to start working on Voilà. Custom templates, a dashboard gallery, logos and UX mockups for JupyterLab extensions have been developed.","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_68":{"__typename":"Paragraph","id":"83831166c231_68","name":"ed29","type":"P","href":null,"layout":null,"metadata":null,"text":"We will soon publish a more detailed post on the workshop, detailing the many tracks of development that have been explored!","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_69":{"__typename":"Paragraph","id":"83831166c231_69","name":"a158","type":"H3","href":null,"layout":null,"metadata":null,"text":"What is coming?","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_70":{"__typename":"Paragraph","id":"83831166c231_70","name":"752c","type":"P","href":null,"layout":null,"metadata":null,"text":"There is a lot of planned work around Voilà in the next weeks and months. Current work streams include better integration with JupyterHub for publicly sharing dashboard between users, as well as JupyterLab extensions (a Voilà \"preview\" extension for notebooks, and a WYSIWYG editor for dashboard layouts). There are also ongoing discussions with the OVH cloud provider (which already supports binder by handling some of its traffic) on hosting a binder-like service dedicated to Voilà dashboards. So stay tuned for more exciting developments!","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":220,"end":259,"href":"https:\u002F\u002Fgithub.com\u002FQuantStack\u002Fvoila\u002Fpull\u002F217","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":350,"end":353,"href":"https:\u002F\u002Fwww.ovh.com\u002Ffr\u002F","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":110,"end":137,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":195,"end":216,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":110,"end":137,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":195,"end":216,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:83831166c231_71":{"__typename":"Paragraph","id":"83831166c231_71","name":"5d74","type":"P","href":null,"layout":null,"metadata":null,"text":"Last but not least, we are especially excited about what you will be building upon Voilà!","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"STRONG","start":57,"end":60,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":57,"end":60,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null
