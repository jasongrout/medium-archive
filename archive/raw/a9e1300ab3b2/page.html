1781219857"},"NewsletterV3:e5c07052e9e0":{"__typename":"NewsletterV3","id":"e5c07052e9e0","type":"NEWSLETTER_TYPE_AUTHOR","slug":"e61781219857","name":"e61781219857","collection":null,"user":{"__ref":"User:e61781219857"}},"User:e61781219857":{"__typename":"User","id":"e61781219857","name":"Duc Trung Le","username":"trungleduc","newsletterV3":{"__ref":"NewsletterV3:e5c07052e9e0"},"linkedAccounts":{"__ref":"LinkedAccounts:e61781219857"},"isSuspended":false,"customDomainState":null,"hasSubdomain":false,"imageId":"1*7-GjML2g6mF8kq3hztOEWg.jpeg","verifications":{"__typename":"VerifiedInfo","isBookAuthor":false},"bio":"Scientific Software Engineer at QuantStack","socialStats":{"__typename":"SocialStats","followerCount":47,"followingCount":1,"collectionFollowingCount":2},"allowNotes":true,"membership":null,"viewerEdge":{"__ref":"UserViewerEdge:userId:e61781219857-viewerId:lo_4ae9bfd89d4c"},"twitterScreenName":"trung_leduc"},"Topic:decb52b64abf":{"__typename":"Topic","slug":"programming","id":"decb52b64abf"},"Paragraph:98cf595e0f37_0":{"__typename":"Paragraph","id":"98cf595e0f37_0","name":"8f33","type":"H3","href":null,"layout":null,"metadata":null,"text":"Need for Speed: Voilà edition","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:98cf595e0f37_1":{"__typename":"Paragraph","id":"98cf595e0f37_1","name":"3bf6","type":"H4","href":null,"layout":null,"metadata":null,"text":"TL;DR: Voilà 0.3.0 is now available!","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"EM","start":0,"end":7,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:98cf595e0f37_2":{"__typename":"Paragraph","id":"98cf595e0f37_2","name":"3962","type":"IMG","href":null,"layout":"OUTSET_CENTER","metadata":{"__typename":"ImageMetadata","id":"1*gSWxQGu60SG5DdH8MIzCjw.png","originalHeight":1117,"originalWidth":3234,"focusPercentX":null,"focusPercentY":null,"alt":null},"text":"","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:98cf595e0f37_3":{"__typename":"Paragraph","id":"98cf595e0f37_3","name":"5034","type":"P","href":null,"layout":null,"metadata":null,"text":"Voilà turns Jupyter notebooks into standalone applications without requiring any modification to the content. You want to share your content with non-technical readers? Just call Voilà with the notebook to turn it into a deployable web application. The simplicity of Voilà comes at a cost: the page load time.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":0,"end":5,"href":"https:\u002F\u002Fblog.jupyter.org\u002Fand-voil%C3%A0-f6a2c08a4a93","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":290,"end":303,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"EM","start":304,"end":309,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:98cf595e0f37_4":{"__typename":"Paragraph","id":"98cf595e0f37_4","name":"4684","type":"P","href":null,"layout":null,"metadata":null,"text":"We set ourselves to fix this Achilles’ heel while preserving the ease-of-use of Voilà. Today we are pleased to announce the release of Voilà 0.3.0, with a focus on performance.","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:98cf595e0f37_5":{"__typename":"Paragraph","id":"98cf595e0f37_5","name":"2f50","type":"H3","href":null,"layout":null,"metadata":null,"text":"Motivation","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:98cf595e0f37_6":{"__typename":"Paragraph","id":"98cf595e0f37_6","name":"7e42","type":"PQ","href":null,"layout":null,"metadata":null,"text":"Page load time has a critical impact on user experience of a website.","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:98cf595e0f37_7":{"__typename":"Paragraph","id":"98cf595e0f37_7","name":"0fae","type":"P","href":null,"layout":null,"metadata":null,"text":"According to Kissmetrics, nearly half of web users expect a site to load in 2 seconds or less, and they tend to abandon a site that is not loaded within 3 seconds.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":13,"end":24,"href":"https:\u002F\u002Fblog.kissmetrics.com\u002Fwp-content\u002Fuploads\u002F2011\u002F04\u002Floading-time.pdf","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:98cf595e0f37_8":{"__typename":"Paragraph","id":"98cf595e0f37_8","name":"83f4","type":"P","href":null,"layout":null,"metadata":null,"text":"In the case of Voilà, a simple dashboard takes around one second to render and more complicated dashboards (involving libraries import, data fetching, and widgets) can easily push users out of their comfort zone. Several efforts have been made to improve the situation, from adding an execution progress indicator to enhancing the rendering technique. The load time of a medium-to-high complexity notebook has not been cut down to a desirable range yet. That is why in the 0.3.0 version, we aimed at addressing the main bottleneck of Voilà: the execution of notebook.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"EM","start":541,"end":566,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:98cf595e0f37_9":{"__typename":"Paragraph","id":"98cf595e0f37_9","name":"74c7","type":"H3","href":null,"layout":null,"metadata":null,"text":"Preheated kernels","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:98cf595e0f37_10":{"__typename":"Paragraph","id":"98cf595e0f37_10","name":"6980","type":"P","href":null,"layout":null,"metadata":null,"text":"Based upon an excellent idea of the hotpot_km project about the pooling hot-loaded Jupyter kernels, we implemented a new solution called “preheated kernels” to diminish the waiting time for starting a new python kernel and for executing the requested notebook.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":36,"end":45,"href":"https:\u002F\u002Fgithub.com\u002Fvoila-dashboards\u002Fhotpot_km","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:98cf595e0f37_11":{"__typename":"Paragraph","id":"98cf595e0f37_11","name":"d63e","type":"P","href":null,"layout":null,"metadata":null,"text":"Preheated kernels can be activated just by setting thepreheat_kernel option to Truein the Voilà command line or configuration file. For example, this command will activate preheated kernels feature for the voila.ipynb notebook with a pool of five kernels:","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"CODE","start":54,"end":68,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"CODE","start":79,"end":83,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"CODE","start":206,"end":217,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:98cf595e0f37_12":{"__typename":"Paragraph","id":"98cf595e0f37_12","name":"b000","type":"PRE","href":null,"layout":null,"metadata":null,"text":"voila voila.ipynb --preheat_kernel=True --pool_size=5","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:98cf595e0f37_13":{"__typename":"Paragraph","id":"98cf595e0f37_13","name":"e6ff","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__typename":"ImageMetadata","id":"1*djVMI5ujhEq6xVbYJNzuuA.gif","originalHeight":1320,"originalWidth":2504,"focusPercentX":null,"focusPercentY":null,"alt":"Speed comparison between Voila 0.3.0 and 0.2.x"},"text":"Speed comparison between Voilà 0.3.0 with preheated kernel and 0.2.16","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:98cf595e0f37_14":{"__typename":"Paragraph","id":"98cf595e0f37_14","name":"3ee5","type":"P","href":null,"layout":null,"metadata":null,"text":"Behind the scene, the two following actions are performed:","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:98cf595e0f37_15":{"__typename":"Paragraph","id":"98cf595e0f37_15","name":"d6ae","type":"ULI","href":null,"layout":null,"metadata":null,"text":"For each notebook, a queue of kernels is created and the notebook is executed in every kernel. When a new client requests a kernel, the oldest preheated kernel of the pool is used and another kernel is started asynchronously to refill the pool.","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:98cf595e0f37_16":{"__typename":"Paragraph","id":"98cf595e0f37_16","name":"6206","type":"ULI","href":null,"layout":null,"metadata":null,"text":"The rendered HTML for the notebook is produced in advance for each preheated kernel and directly served to the client upon connection.","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:98cf595e0f37_17":{"__typename":"Paragraph","id":"98cf595e0f37_17","name":"ef8b","type":"ULI","href":null,"layout":null,"metadata":null,"text":"If the kernel pool is empty, Voilà will fall back to starting a new kernel and render the notebook as usual. The advanced configurations of preheated kernels are detailed in Voilà’s official documentation.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":174,"end":204,"href":"https:\u002F\u002Fvoila.readthedocs.io\u002Fen\u002Flatest\u002Fcustomize.html#preheated-kernels","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:98cf595e0f37_18":{"__typename":"Paragraph","id":"98cf595e0f37_18","name":"a549","type":"H3","href":null,"layout":null,"metadata":null,"text":"Partially pre-render notebook","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:98cf595e0f37_19":{"__typename":"Paragraph","id":"98cf595e0f37_19","name":"e9b2","type":"P","href":null,"layout":null,"metadata":null,"text":"To benefit from the acceleration of preheated kernels mode, the notebooks need to be pre-rendered before users connect to Voilà. But in many real-world applications, the notebook requires user-specific data, which makes pre-rendering impossible. To overcome this limit, Voilà offers a feature to handle the most used method for providing user data: the URL query string.","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:98cf595e0f37_20":{"__typename":"Paragraph","id":"98cf595e0f37_20","name":"833d","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__typename":"ImageMetadata","id":"1*Gwq82pb0qAInlPUJm_-JYA.gif","originalHeight":1378,"originalWidth":2560,"focusPercentX":null,"focusPercentY":null,"alt":null},"text":"In preheated kernels mode, Voilà executed the first 4 cells before waiting for the query string from the user.","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:98cf595e0f37_21":{"__typename":"Paragraph","id":"98cf595e0f37_21","name":"5d94","type":"P","href":null,"layout":null,"metadata":null,"text":"In normal mode, Voilà users can get the query string at run time through the QUERY_STRING environment variable:","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"CODE","start":77,"end":89,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:98cf595e0f37_22":{"__typename":"Paragraph","id":"98cf595e0f37_22","name":"e55a","type":"PRE","href":null,"layout":null,"metadata":null,"text":"import os\nquery_string = os.getenv('QUERY_STRING')","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"STRONG","start":0,"end":6,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":7,"end":9,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:98cf595e0f37_23":{"__typename":"Paragraph","id":"98cf595e0f37_23","name":"fced","type":"P","href":null,"layout":null,"metadata":null,"text":"In preheated kernels mode, users can simply replace the os.getenv call with the helper get_query_string from voila.utils","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"CODE","start":56,"end":65,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"CODE","start":87,"end":103,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"CODE","start":109,"end":120,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:98cf595e0f37_24":{"__typename":"Paragraph","id":"98cf595e0f37_24","name":"1fb2","type":"PRE","href":null,"layout":null,"metadata":null,"text":"from voila.utils import get_query_string\nquery_string = get_query_string()","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"STRONG","start":0,"end":4,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":5,"end":16,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"STRONG","start":17,"end":23,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:98cf595e0f37_25":{"__typename":"Paragraph","id":"98cf595e0f37_25","name":"a462","type":"P","href":null,"layout":null,"metadata":null,"text":"get_query_string will pause the execution of the notebook by the preheated kernel at this cell and wait for an actual user to connect to Voilà, then get_query_string will return the URL query string and continue the execution of the remaining cells.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"CODE","start":0,"end":16,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"CODE","start":149,"end":165,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:98cf595e0f37_26":{"__typename":"Paragraph","id":"98cf595e0f37_26","name":"383a","type":"P","href":null,"layout":null,"metadata":null,"text":"To maximize the benefits of preheated kernels, the user-independent cells should be placed before the get_query_stringcall.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"CODE","start":102,"end":118,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:98cf595e0f37_27":{"__typename":"Paragraph","id":"98cf595e0f37_27","name":"f01a","type":"H3","href":null,"layout":null,"metadata":null,"text":"What’s next?","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:98cf595e0f37_28":{"__typename":"Paragraph","id":"98cf595e0f37_28","name":"daec","type":"P","href":null,"layout":null,"metadata":null,"text":"There is more in the works to improve Voilà’s performances. Beyond kernel hot pooling, we will improve the performance of rendering Jupyter widgets in the front-end. Several of these improvements will be enabled with the upcoming 8.0 release of ipywidgets, and more optimizations are in the works.","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:98cf595e0f37_29":{"__typename":"Paragraph","id":"98cf595e0f37_29","name":"7257","type":"H3","href":null,"layout":null,"metadata":null,"text":"Acknowledgments","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:98cf595e0f37_30":{"__typename":"Paragraph","id":"98cf595e0f37_30","name":"8eeb","type":"P","href":null,"layout":null,"metadata":null,"text":"We would like to thank Vidar Tonaas Fauske and Maarten Breddels for the prior art on the hotpot_km project, which was an inspiration for this work in core Voilà.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":23,"end":42,"href":"https:\u002F\u002Fgithub.com\u002Fvidartf","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":47,"end":63,"href":"https:\u002F\u002Fgithub.com\u002Fmaartenbreddels","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":89,"end":98,"href":"https:\u002F\u002Fgithub.com\u002Fvoila-dashboards\u002Fhotpot_km","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:98cf595e0f37_31":{"__typename":"Paragraph","id":"98cf595e0f37_31","name":"9bd0","type":"H3","href":
