214b7f4767"},"NewsletterV3:8909b6e63e92":{"__typename":"NewsletterV3","id":"8909b6e63e92","type":"NEWSLETTER_TYPE_AUTHOR","slug":"f8214b7f4767","name":"f8214b7f4767","collection":null,"user":{"__ref":"User:f8214b7f4767"}},"User:f8214b7f4767":{"__typename":"User","id":"f8214b7f4767","name":"Jeremy Tuloup","username":"jeremy.tuloup","newsletterV3":{"__ref":"NewsletterV3:8909b6e63e92"},"linkedAccounts":{"__ref":"LinkedAccounts:f8214b7f4767"},"isSuspended":false,"customDomainState":null,"hasSubdomain":false,"imageId":"1*hT63x2cbtYug-AW0v5BEYA.png","verifications":{"__typename":"VerifiedInfo","isBookAuthor":false},"bio":"Scientific Software Engineer at QuantStack, Jupyter Core Developer and Distinguished Contributor.","socialStats":{"__typename":"SocialStats","followerCount":561,"followingCount":2,"collectionFollowingCount":1},"allowNotes":true,"membership":null,"viewerEdge":{"__ref":"UserViewerEdge:userId:f8214b7f4767-viewerId:lo_661c1d816c9a"},"twitterScreenName":"jtpio"},"Topic:decb52b64abf":{"__typename":"Topic","slug":"programming","id":"decb52b64abf"},"Paragraph:fd039937b31b_0":{"__typename":"Paragraph","id":"fd039937b31b_0","name":"5b3a","type":"H3","href":null,"layout":null,"metadata":null,"text":"JupyterLite: Jupyter ❤️ WebAssembly ❤️ Python","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_1":{"__typename":"Paragraph","id":"fd039937b31b_1","name":"c2ca","type":"P","href":null,"layout":null,"metadata":null,"text":"JupyterLite is a JupyterLab distribution that runs entirely in the web browser, backed by in-browser language kernels.","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_2":{"__typename":"Paragraph","id":"fd039937b31b_2","name":"ff60","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__typename":"ImageMetadata","id":"1*CMvcTaLSAD5A-WHCtnIFwA.png","originalHeight":512,"originalWidth":512,"focusPercentX":null,"focusPercentY":null,"alt":null},"text":"","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_3":{"__typename":"Paragraph","id":"fd039937b31b_3","name":"b5f9","type":"H3","href":null,"layout":null,"metadata":null,"text":"Motivation","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_4":{"__typename":"Paragraph","id":"fd039937b31b_4","name":"3342","type":"P","href":null,"layout":null,"metadata":null,"text":"JupyterLite is a reboot of several attempts at making a full static Jupyter distribution that runs in the browser, without having to start the Python Jupyter Server on the host machine, usually done by running jupyter lab or jupyter notebook in a terminal.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"CODE","start":210,"end":221,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"CODE","start":225,"end":241,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_5":{"__typename":"Paragraph","id":"fd039937b31b_5","name":"d8ad","type":"P","href":null,"layout":null,"metadata":null,"text":"The goal of the project is to provide a lightweight computing environment accessible in a matter of seconds with a single click, in a web browser, and without having to install anything on the end-user device.","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_6":{"__typename":"Paragraph","id":"fd039937b31b_6","name":"ea93","type":"P","href":null,"layout":null,"metadata":null,"text":"With in-browser distributions, there is no need to provision the execution environment in the backend. Since the application is mostly a set of static files, it scales more easily, and it is also easier to deploy.","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_7":{"__typename":"Paragraph","id":"fd039937b31b_7","name":"8163","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__typename":"ImageMetadata","id":"1*bR--bXsuiMIDz-D_V4BfLw.png","originalHeight":990,"originalWidth":1600,"focusPercentX":null,"focusPercentY":null,"alt":null},"text":"JupyterLite running in the browser as a static website on ReadTheDocs","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_8":{"__typename":"Paragraph","id":"fd039937b31b_8","name":"9b3f","type":"H3","href":null,"layout":null,"metadata":null,"text":"A full JupyterLab distribution running in the browser","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_9":{"__typename":"Paragraph","id":"fd039937b31b_9","name":"d2f4","type":"P","href":null,"layout":null,"metadata":null,"text":"JupyterLite is built from the ground up, reusing many JupyterLab plugins and components as is.","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_10":{"__typename":"Paragraph","id":"fd039937b31b_10","name":"2a42","type":"P","href":null,"layout":null,"metadata":null,"text":"In addition to JupyterLab, JupyterLite also includes the RetroLab interface by default:","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":57,"end":65,"href":"https:\u002F\u002Fgithub.com\u002Fjupyterlab\u002Fretrolab","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_11":{"__typename":"Paragraph","id":"fd039937b31b_11","name":"2934","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__typename":"ImageMetadata","id":"1*B1Se7Fe1JXBt2a1NjwRmxg.png","originalHeight":985,"originalWidth":1599,"focusPercentX":null,"focusPercentY":null,"alt":null},"text":"JupyterLite with the RetroLab interface","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_12":{"__typename":"Paragraph","id":"fd039937b31b_12","name":"08de","type":"P","href":null,"layout":null,"metadata":null,"text":"By reusing JupyterLab components, JupyterLite benefits from many of the upstream improvements such as new features, accessibility fixes, and upkeep improvements. The recent work on real time collaboration coming in JupyterLab 3.1 and championed by Kevin Jahns, Carlos Herrero, and Eric Charles can be enabled in JupyterLite too!","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":166,"end":204,"href":"https:\u002F\u002Fblog.jupyter.org\u002Fhow-we-made-jupyter-notebooks-collaborative-with-yjs-b8dff6a9d8af?source=collection_home---6------0-----------------------","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":248,"end":259,"href":"https:\u002F\u002Ftwitter.com\u002Fkevin_jahns","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":261,"end":275,"href":"https:\u002F\u002Ftwitter.com\u002FcarlosHerreroB\u002F","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":281,"end":293,"href":"https:\u002F\u002Ftwitter.com\u002Fecharles","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_13":{"__typename":"Paragraph","id":"fd039937b31b_13","name":"9ffc","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__typename":"ImageMetadata","id":"1*HwMx3Fd6iICkWjjvUCtvwA.gif","originalHeight":860,"originalWidth":1992,"focusPercentX":null,"focusPercentY":null,"alt":null},"text":"Real Time Collaboration with JupyterLite on ReadTheDocs","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_14":{"__typename":"Paragraph","id":"fd039937b31b_14","name":"96eb","type":"H3","href":null,"layout":null,"metadata":null,"text":"Pyolite, a Python kernel backed by Pyodide","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_15":{"__typename":"Paragraph","id":"fd039937b31b_15","name":"9661","type":"P","href":null,"layout":null,"metadata":null,"text":"Pyodide consists of the CPython 3.8 interpreter compiled to WebAssembly which allows Python to run in the browser. Many popular scientific Python packages have also been compiled and made available. In addition, Pyodide can install any Python package with a pure Python wheel from the Python Package Index (PyPI). Pyodide also includes a comprehensive foreign function interface that exposes the ecosystem of Python packages to JavaScript and the browser user interface, including the DOM, to Python.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":0,"end":7,"href":"https:\u002F\u002Fpyodide.org","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_16":{"__typename":"Paragraph","id":"fd039937b31b_16","name":"d6c5","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__typename":"ImageMetadata","id":"1*usFUmvzRo6v8TuRFQhK0uw.png","originalHeight":176,"originalWidth":700,"focusPercentX":null,"focusPercentY":null,"alt":null},"text":"Pyodide: Python with the scientific stack, compiled to WebAssembly","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_17":{"__typename":"Paragraph","id":"fd039937b31b_17","name":"5c56","type":"P","href":null,"layout":null,"metadata":null,"text":"Currently at version 0.17, Pyodide has benefited from many improvements over the past years: smaller binary size, support for asyncio, and better type translations between Python and JavaScript.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"CODE","start":126,"end":133,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":21,"end":25,"href":"https:\u002F\u002Fhacks.mozilla.org\u002F2021\u002F04\u002Fpyodide-spin-out-and-0-17-release\u002F","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_18":{"__typename":"Paragraph","id":"fd039937b31b_18","name":"f232","type":"P","href":null,"layout":null,"metadata":null,"text":"JupyterLite ships by default with Pyolite, a Python kernel backed by Pyodide. Pyolite runs in a Web Worker and thus doesn’t block the main UI thread when intensive computations are executed.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"CODE","start":34,"end":41,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":96,"end":106,"href":"https:\u002F\u002Fdeveloper.mozilla.org\u002Fen-US\u002Fdocs\u002FWeb\u002FAPI\u002FWeb_Workers_API","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_19":{"__typename":"Paragraph","id":"fd039937b31b_19","name":"2f18","type":"H3","href":null,"layout":null,"metadata":null,"text":"IPython in the browser","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_20":{"__typename":"Paragraph","id":"fd039937b31b_20","name":"692e","type":"P","href":null,"layout":null,"metadata":null,"text":"Thanks to the work by Madhur Tandon in this pull request, Pyolite is now powered by IPython. This provides access to magics, code completion, rich display, interactive widgets, and many other features.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":44,"end":56,"href":"https:\u002F\u002Fgithub.com\u002Fjupyterlite\u002Fjupyterlite\u002Fpull\u002F171","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_21":{"__typename":"Paragraph","id":"fd039937b31b_21","name":"ecd9","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__typename":"ImageMetadata","id":"1*2WBnuwRGkASGVNYUGjyPHg.gif","originalHeight":675,"originalWidth":1200,"focusPercentX":null,"focusPercentY":null,"alt":null},"text":"Using IPython in JupyterLite","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_22":{"__typename":"Paragraph","id":"fd039937b31b_22","name":"f0bd","type":"H3","href":null,"layout":null,"metadata":null,"text":"Interactive Visualization","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_23":{"__typename":"Paragraph","id":"fd039937b31b_23","name":"ce10","type":"P","href":null,"layout":null,"metadata":null,"text":"Many visualizations libraries such as Altair and Plotly are also supported in JupyterLite, allowing for quick and convenient figures and plots right in the browser:","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":38,"end":44,"href":"https:\u002F\u002Faltair-viz.github.io\u002F","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":49,"end":55,"href":"https:\u002F\u002Fplotly.com\u002F","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_24":{"__typename":"Paragraph","id":"fd039937b31b_24","name":"83f6","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__typename":"ImageMetadata","id":"1*SRr162bkckWsmoSMxVd2uQ.gif","originalHeight":800,"originalWidth":1200,"focusPercentX":null,"focusPercentY":null,"alt":null},"text":"Using Altair in JupyterLite","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_25":{"__typename":"Paragraph","id":"fd039937b31b_25","name":"7a4b","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__typename":"ImageMetadata","id":"1*w7Y4wRz9h2OFMgm5MfdD0A.gif","originalHeight":800,"originalWidth":1200,"focusPercentX":null,"focusPercentY":null,"alt":null},"text":"Creating Plotly figures in JupyterLite","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_26":{"__typename":"Paragraph","id":"fd039937b31b_26","name":"c6e5","type":"H3","href":null,"layout":null,"metadata":null,"text":"Support for Jupyter Widgets","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_27":{"__typename":"Paragraph","id":"fd039937b31b_27","name":"8b39","type":"P","href":null,"layout":null,"metadata":null,"text":"Jupyter Widgets rely on the Custom Messages specification of the Jupyter Protocol to send messages back and forth between the kernel and the frontend. This pull request by Martin Renou added support for Comms in the Pyolite kernel, which enabled many of the existing core and third-party Jupyter Widgets to work out of the box in JupyterLite such as bqplot, ipyleaflet and ipycanvas.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":28,"end":81,"href":"https:\u002F\u002Fjupyter-client.readthedocs.io\u002Fen\u002Flatest\u002Fmessaging.html#custom-messages","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":156,"end":168,"href":"https:\u002F\u002Fgithub.com\u002Fjupyterlite\u002Fjupyterlite\u002Fpull\u002F145","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":350,"end":356,"href":"https:\u002F\u002Fgithub.com\u002Fbqplot\u002Fbqplot","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":358,"end":368,"href":"https:\u002F\u002Fgithub.com\u002Fjupyter-widgets\u002Fipyleaflet","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":373,"end":382,"href":"https:\u002F\u002Fgithub.com\u002FmartinRenou\u002Fipycanvas","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_28":{"__typename":"Paragraph","id":"fd039937b31b_28","name":"fc09","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__typename":"ImageMetadata","id":"1*c1DIbxS6bZ7bHDcOTEIJfg.gif","originalHeight":800,"originalWidth":1200,"focusPercentX":null,"focusPercentY":null,"alt":null},"text":"JupyterLite comes with support for Jupyter Widgets","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_29":{"__typename":"Paragraph","id":"fd039937b31b_29","name":"b5cf","type":"H3","href":null,"layout":null,"metadata":null,"text":"More than just Python","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_30":{"__typename":"Paragraph","id":"fd039937b31b_30","name":"c88e","type":"P","href":null,"layout":null,"metadata":null,"text":"JupyterLite makes it possible to have plenty of other kernels also running in the browser. For now, the default distribution includes a JavaScript and a p5 kernel:","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":153,"end":155,"href":"https:\u002F\u002Fp5js.org\u002F","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_31":{"__typename":"Paragraph","id":"fd039937b31b_31","name":"6773","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__typename":"ImageMetadata","id":"1*5XFdmBdQWeONbRD3nuQe0A.png","originalHeight":473,"originalWidth":708,"focusPercentX":null,"focusPercentY":null,"alt":null},"text":"Multiple kernels are available in JupyterLite","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_32":{"__typename":"Paragraph","id":"fd039937b31b_32","name":"bb74","type":"P","href":null,"layout":null,"metadata":null,"text":"Both the JavaScript and the p5 kernels run in an IFrame as the code execution sandbox. With the Jupyter display protocol, users can easily render custom animations in the browser:","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_33":{"__typename":"Paragraph","id":"fd039937b31b_33","name":"3808","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__typename":"ImageMetadata","id":"1*kPYtSDP3aE5_M5AmDT-Uvw.gif","originalHeight":900,"originalWidth":1600,"focusPercentX":null,"focusPercentY":null,"alt":null},"text":"The p5.js kernel in JupyterLite","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_34":{"__typename":"Paragraph","id":"fd039937b31b_34","name":"1bdf","type":"H3","href":null,"layout":null,"metadata":null,"text":"Highly Customizable","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_35":{"__typename":"Paragraph","id":"fd039937b31b_35","name":"326d","type":"P","href":null,"layout":null,"metadata":null,"text":"Just like many existing Jupyter tools, JupyterLite can easily be configured for custom needs.","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_36":{"__typename":"Paragraph","id":"fd039937b31b_36","name":"63d5","type":"P","href":null,"layout":null,"metadata":null,"text":"It supports the new JupyterLab prebuilt extension system added to the 3.0 release. Existing JupyterLab extensions can then easily be reused in JupyterLite too!","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":20,"end":56,"href":"https:\u002F\u002Fjupyterlab.readthedocs.io\u002Fen\u002Fstable\u002Fextension\u002Fextension_dev.html#prebuilt-extensions","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_37":{"__typename":"Paragraph","id":"fd039937b31b_37","name":"c2a5","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__typename":"ImageMetadata","id":"1*69CnccBrufVEEU0wqE_f7Q.gif","originalHeight":800,"originalWidth":1200,"focusPercentX":null,"focusPercentY":null,"alt":null},"text":"The JupyterLab Drawio extension running in JupyterLite","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_38":{"__typename":"Paragraph","id":"fd039937b31b_38","name":"7555","type":"P","href":null,"layout":null,"metadata":null,"text":"The in-browser server part of JupyterLite also follows a plugin-based approach. The server is a Lumino application without a shell and registers multiple plugins such as kernels, the contents manager or the sessions service. This plugin-based approach makes it very convenient for deployers and site administrators to swap a plugin for another one. For instance, they might want to swap the default contents manager that stores notebooks and files in the browser local storage with another plugin that would save them on AWS S3 instead.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":96,"end":102,"href":"https:\u002F\u002Fgithub.com\u002Fjupyterlab\u002Flumino","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_39":{"__typename":"Paragraph","id":"fd039937b31b_39","name":"41c3","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__typename":"ImageMetadata","id":"1*f7viaaS4SYTBpjA6DTPsDQ.png","originalHeight":742,"originalWidth":1448,"focusPercentX":null,"focusPercentY":null,"alt":null},"text":"Overview of the plugin-based architecture of JupyterLite","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_40":{"__typename":"Paragraph","id":"fd039937b31b_40","name":"5401","type":"P","href":null,"layout":null,"metadata":null,"text":"The modularity and flexibility of JupyterLite make it possible to easily add new kernels. For example, the Basthon kernel uses a slightly different execution model than Pyolite. It runs in the main UI thread so users can manipulate the main window DOM from within Python directly, while Pyolite runs in a Web Worker as a background thread. Both approaches have pros and cons, and the JupyterLite plugin system lets extension authors have full control over their kernels.","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_41":{"__typename":"Paragraph","id":"fd039937b31b_41","name":"a430","type":"P","href":null,"layout":null,"metadata":null,"text":"A prototype for running Basthon in JupyterLite is being developed in the following repository: https:\u002F\u002Fframagit.org\u002Fcasatir\u002Fbasthon-jupyterlab\u002F","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":95,"end":143,"href":"https:\u002F\u002Fframagit.org\u002Fcasatir\u002Fbasthon-jupyterlab\u002F","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_42":{"__typename":"Paragraph","id":"fd039937b31b_42","name":"1831","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__typename":"ImageMetadata","id":"1*mMmSo4GPx7rpxbMpyf-VAA.jpeg","originalHeight":768,"originalWidth":1366,"focusPercentX":null,"focusPercentY":null,"alt":null},"text":"Basthon in JupyterLite","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_43":{"__typename":"Paragraph","id":"fd039937b31b_43","name":"32c7","type":"H3","href":null,"layout":null,"metadata":null,"text":"Deploying JupyterLite","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_44":{"__typename":"Paragraph","id":"fd039937b31b_44","name":"bf84","type":"P","href":null,"layout":null,"metadata":null,"text":"JupyterLite can easily be deployed as a static website. That’s it, no server, no complicated setup, no scalability issue. Just a plain HTTP server to serve static files to users.","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_45":{"__typename":"Paragraph","id":"fd039937b31b_45","name":"7439","type":"P","href":null,"layout":null,"metadata":null,"text":"This simple approach makes it possible to use a variety of options: nginx, Binder, GitHub Pages or GitLab Pages, Vercel, Netlify, and more. It can even be deployed to ReadTheDocs, which is where the default JupyterLite demo site is hosted and continuously updated.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":75,"end":82,"href":"https:\u002F\u002Fmybinder.org","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_46":{"__typename":"Paragraph","id":"fd039937b31b_46","name":"6713","type":"P","href":null,"layout":null,"metadata":null,"text":"Many of the deployment scenarios are already documented in https:\u002F\u002Fjupyterlite.readthedocs.io\u002Fen\u002Flatest\u002Fdeploying.html. There is also a demo template to easily deploy a custom JupyterLite website on GitHub Pages with a single click: https:\u002F\u002Fgithub.com\u002Fjupyterlite\u002Fdemo","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":59,"end":118,"href":"https:\u002F\u002Fjupyterlite.readthedocs.io\u002Fen\u002Flatest\u002Fdeploying.html","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":233,"end":268,"href":"https:\u002F\u002Fgithub.com\u002Fjupyterlite\u002Fdemo","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_47":{"__typename":"Paragraph","id":"fd039937b31b_47","name":"36f9","type":"P","href":null,"layout":null,"metadata":null,"text":"Thanks to the work by Nicholas Bollweg in this pull request, JupyterLite now offers a jupyterlite command line tool to make custom deployments much more convenient.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"CODE","start":86,"end":97,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":47,"end":59,"href":"https:\u002F\u002Fgithub.com\u002Fjupyterlite\u002Fjupyterlite\u002Fpull\u002F147","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":98,"end":115,"href":"https:\u002F\u002Fpypi.org\u002Fproject\u002Fjupyterlite\u002F","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_48":{"__typename":"Paragraph","id":"fd039937b31b_48","name":"c425","type":"P","href":null,"layout":null,"metadata":null,"text":"One of the goals of JupyterLite is to let anyone build their custom distribution with the set of plugins and extensions they would like to use. For now, it requires using the jupyterlite CLI, but we can imagine having a more user-friendly way of exporting a custom JupyterLite website.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"CODE","start":175,"end":186,"href":null,"anchorType":null,"userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_49":{"__typename":"Paragraph","id":"fd039937b31b_49","name":"b2ca","type":"IMG","href":null,"layout":"INSET_CENTER","metadata":{"__typename":"ImageMetadata","id":"1*LL_UkItjshAzsEEDB4cI2A.png","originalHeight":1165,"originalWidth":1852,"focusPercentX":null,"focusPercentY":null,"alt":null},"text":"A mock-up for the JupyterLite Exporter","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_50":{"__typename":"Paragraph","id":"fd039937b31b_50","name":"a148","type":"H3","href":null,"layout":null,"metadata":null,"text":"A wide range of use cases","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_51":{"__typename":"Paragraph","id":"fd039937b31b_51","name":"d9ab","type":"P","href":null,"layout":null,"metadata":null,"text":"With the ease of deployment and the low barrier to entry, JupyterLite is an excellent fit for a wide range of use cases.","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_52":{"__typename":"Paragraph","id":"fd039937b31b_52","name":"b2fc","type":"P","href":null,"layout":null,"metadata":null,"text":"In the educational space, it simplifies access to teaching materials and computing environments. Teachers and students can focus on the content of their classes without worrying about server deployments and monitoring.","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_53":{"__typename":"Paragraph","id":"fd039937b31b_53","name":"2bc5","type":"P","href":null,"layout":null,"metadata":null,"text":"With JupyterLite we also hope to enable the next wave of Jupyter users and make the whole ecosystem even more accessible to newcomers and the wider community.","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_54":{"__typename":"Paragraph","id":"fd039937b31b_54","name":"fc93","type":"P","href":null,"layout":null,"metadata":null,"text":"For simpler and smaller-scale projects, it could even help reduce the load on mybinder.org by having a “binderlite” version of JupyterLite deployed on a CDN.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":78,"end":90,"href":"https:\u002F\u002Fmybinder.org","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":103,"end":138,"href":"https:\u002F\u002Ftwitter.com\u002Ffperez_org\u002Fstatus\u002F1385825172230262794","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_55":{"__typename":"Paragraph","id":"fd039937b31b_55","name":"a154","type":"H3","href":null,"layout":null,"metadata":null,"text":"Try it online","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_56":{"__typename":"Paragraph","id":"fd039937b31b_56","name":"64e0","type":"P","href":null,"layout":null,"metadata":null,"text":"JupyterLite can easily be tested in a web browser using the following link:","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_57":{"__typename":"Paragraph","id":"fd039937b31b_57","name":"e89e","type":"P","href":null,"layout":null,"metadata":null,"text":"https:\u002F\u002Fjupyterlite.github.io\u002Fdemo","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":0,"end":34,"href":"https:\u002F\u002Fjupyterlite.github.io\u002Fdemo","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_58":{"__typename":"Paragraph","id":"fd039937b31b_58","name":"65b7","type":"IMG","href":"https:\u002F\u002Fjupyterlite.github.io\u002Fdemo","layout":"INSET_CENTER","metadata":{"__typename":"ImageMetadata","id":"1*CMvcTaLSAD5A-WHCtnIFwA.png","originalHeight":512,"originalWidth":512,"focusPercentX":null,"focusPercentY":null,"alt":null},"text":"","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_59":{"__typename":"Paragraph","id":"fd039937b31b_59","name":"a758","type":"H3","href":null,"layout":null,"metadata":null,"text":"Try it locally","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_60":{"__typename":"Paragraph","id":"fd039937b31b_60","name":"fcb2","type":"P","href":null,"layout":null,"metadata":null,"text":"JupyterLite can also be used locally. First, install the CLI package with:","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_61":{"__typename":"Paragraph","id":"fd039937b31b_61","name":"ff61","type":"PRE","href":null,"layout":null,"metadata":null,"text":"pip install --pre jupyterlite","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_62":{"__typename":"Paragraph","id":"fd039937b31b_62","name":"0218","type":"P","href":null,"layout":null,"metadata":null,"text":"Then, to build the JupyterLite website and serve it locally:","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_63":{"__typename":"Paragraph","id":"fd039937b31b_63","name":"7a20","type":"PRE","href":null,"layout":null,"metadata":null,"text":"jupyter lite init\njupyter lite build\njupyter lite serve","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_64":{"__typename":"Paragraph","id":"fd039937b31b_64","name":"0359","type":"P","href":null,"layout":null,"metadata":null,"text":"Check out the documentation for more information about the jupyterlite command-line tool: https:\u002F\u002Fjupyterlite.readthedocs.io\u002Fen\u002Flatest\u002Fdeveloper-guide.html","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"CODE","start":59,"end":70,"href":null,"anchorType":null,"userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":90,"end":155,"href":"https:\u002F\u002Fjupyterlite.readthedocs.io\u002Fen\u002Flatest\u002Fdeveloper-guide.html","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_65":{"__typename":"Paragraph","id":"fd039937b31b_65","name":"ae85","type":"H3","href":null,"layout":null,"metadata":null,"text":"Next steps","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_66":{"__typename":"Paragraph","id":"fd039937b31b_66","name":"923e","type":"P","href":null,"layout":null,"metadata":null,"text":"JupyterLite is still under active development, with a lot of improvements planned for the next iterations:","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_67":{"__typename":"Paragraph","id":"fd039937b31b_67","name":"5f8b","type":"ULI","href":null,"layout":null,"metadata":null,"text":"Improve tooling for authoring custom in-browser kernels, reusing the JupyterLab federated (prebuilt) extension system.","hasDropCap":null,"dropCapImage":null,"markups":[],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_68":{"__typename":"Paragraph","id":"fd039937b31b_68","name":"f107","type":"ULI","href":null,"layout":null,"metadata":null,"text":"Improve the package management story in Pyodide with mamba and the conda-forge infrastructure.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":53,"end":58,"href":"https:\u002F\u002Fgithub.com\u002Fmamba-org\u002Fmamba","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":67,"end":93,"href":"https:\u002F\u002Fgithub.com\u002Fconda-forge\u002Fconda-forge.github.io\u002Fissues\u002F1401","anchorType":"LINK","userId":null,"linkMetadata":null}],"codeBlockMetadata":null,"iframe":null,"mixtapeMetadata":null},"Paragraph:fd039937b31b_69":{"__typename":"Paragraph","id":"fd039937b31b_69","name":"92d2","type":"ULI","href":null,"layout":null,"metadata":null,"text":"Reuse the JupyterLite packages in other lab-based applications such as Voilà, Gator, and the Quetz Frontend.","hasDropCap":null,"dropCapImage":null,"markups":[{"__typename":"Markup","type":"A","start":71,"end":76,"href":"https:\u002F\u002Fgithub.com\u002Fvoila-dashboards\u002Fvoila","anchorType":"LINK","userId":null,"linkMetadata":null},{"__typename":"Markup","type":"A","start":78,"end":83,"href":"https:\u002F\u002Fgithub.com\u002Fmamba-org\u002Fgator","anchorType":"LINK","userId":null,"linkMetadata":
