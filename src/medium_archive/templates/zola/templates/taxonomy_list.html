{% extends "base.html" %}
{% block title %}{{ taxonomy.name }} · {{ config.title }}{% endblock %}
{% block content %}
<h1>{{ taxonomy.name }}</h1>
<ul class="term-list">
{% for term in terms %}<li><a href="{{ term.permalink | safe }}">{{ term.name }}</a> ({{ term.pages | length }})</li>
{% endfor %}</ul>
{% endblock %}
