{% extends "base.html" %}
{% block title %}{{ term.name }} · {{ config.title }}{% endblock %}
{% block content %}
<h1>{{ term.name }}</h1>
<ul class="post-list">
{% for page in term.pages %}<li><time>{{ page.date }}</time> <a href="{{ page.permalink | safe }}">{{ page.title }}</a></li>
{% endfor %}</ul>
{% endblock %}
