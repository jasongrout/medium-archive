<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ config.title }}{% endblock %}</title>
<meta name="description" content="{{ config.description }}">
<link rel="alternate" type="application/atom+xml" href="{{ get_url(path="atom.xml") | safe }}" title="{{ config.title }}">
<link rel="stylesheet" href="{{ get_url(path="css/style.css") | safe }}">
</head>
<body>
<header><nav>
<a class="site" href="{{ config.base_url | safe }}">{{ config.title }}</a>
<a href="{{ get_url(path="/tags") | safe }}">Tags</a>
<a href="{{ get_url(path="/authors") | safe }}">Authors</a>
<a href="{{ get_url(path="atom.xml") | safe }}">RSS</a>
<span class="search-box"><input id="search" type="search" placeholder="Search…" autocomplete="off">
<div id="search-results"></div></span>
</nav></header>
<main>
{% block content %}{% endblock %}
</main>
<script src="{{ get_url(path="elasticlunr.min.js") | safe }}"></script>
<script>
(function () {
  var input = document.getElementById("search");
  var results = document.getElementById("search-results");
  var index = null;
  input.addEventListener("focus", function () {
    if (index !== null) return;
    index = false;                       // loading
    var s = document.createElement("script");
    s.src = "{{ get_url(path="search_index.en.js") | safe }}";
    s.onload = function () { index = elasticlunr.Index.load(window.searchIndex); };
    document.head.appendChild(s);
  });
  input.addEventListener("input", function () {
    if (!index || input.value.length < 2) { results.innerHTML = ""; return; }
    var hits = index.search(input.value, {
      bool: "AND", expand: true,
      fields: { title: { boost: 2 }, body: { boost: 1 } },
    }).slice(0, 10);
    results.innerHTML = "";
    hits.forEach(function (h) {
      var a = document.createElement("a");
      a.href = h.ref;
      a.textContent = index.documentStore.getDoc(h.ref).title || h.ref;
      results.appendChild(a);
    });
  });
  document.addEventListener("click", function (e) {
    if (!e.target.closest(".search-box")) results.innerHTML = "";
  });
})();
</script>
</body>
</html>
