<!DOCTYPE html>
<html lang="{{ DEFAULT_LANG }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ SITENAME }}{% endblock %}</title>
<meta name="description" content="{{ SITESUBTITLE }}">
<link rel="alternate" type="application/atom+xml" href="{{ SITEURL }}/{{ FEED_ALL_ATOM }}" title="{{ SITENAME }}">
{% if tag and TAG_FEED_ATOM %}<link rel="alternate" type="application/atom+xml" href="{{ SITEURL }}/{{ TAG_FEED_ATOM.format(slug=tag.slug) }}" title="{{ SITENAME }} - {{ tag }}">
{% elif author and AUTHOR_FEED_ATOM %}<link rel="alternate" type="application/atom+xml" href="{{ SITEURL }}/{{ AUTHOR_FEED_ATOM.format(slug=author.slug) }}" title="{{ SITENAME }} - {{ author }}">
{% endif %}<!-- @include shared/theme-init.html -->
{% if FAVICON %}<link rel="icon" href="{{ SITEURL }}/{{ FAVICON }}">
{% endif %}<link rel="stylesheet" href="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/css/style.css">
</head>
<body>
{% if ANNOUNCEMENT %}<div class="announcement" data-source="{{ ANNOUNCEMENT|e }}" hidden></div>
<!-- @include shared/announcement.html -->
{% endif %}<header class="site-header"><div class="wrap bar">
<a class="site-title" href="{{ SITEURL }}/">{% if AVATAR %}<img src="{{ SITEURL }}/{{ AVATAR }}" alt="">{% endif %}{{ SITENAME }}</a>
<nav>
<a href="{{ SITEURL }}/">Blog</a>
<a href="{{ SITEURL }}/tags/">Tags</a>
<a href="{{ SITEURL }}/authors/">Authors</a>
<a href="{{ SITEURL }}/archives/">Archives</a>
<a href="{{ SITEURL }}/search/">Search</a>
<a class="feed-link" href="{{ SITEURL }}/{{ FEED_ALL_ATOM }}" aria-label="RSS" title="RSS">
<!-- @include shared/feed-icon.html -->
</a>
<!-- @include shared/theme-picker.html -->
</nav>
</div></header>
<!-- @include shared/nav-current.html -->
<main class="wrap">
{% block content %}{% endblock %}
</main>
<footer class="wrap site-footer">{{ SITESUBTITLE }}</footer>
</body>
</html>
