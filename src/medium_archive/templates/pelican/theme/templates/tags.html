{% extends "base.html" %}
{% block title %}Tags · {{ SITENAME }}{% endblock %}
{% block content %}
<h1 class="page-title">Tags</h1>
<!-- @include shared/term-sort.html -->
<p class="term-list">
{% for tag, articles in tags | sort %}<a class="chip" href="{{ SITEURL }}/{{ tag.url }}">{{ tag }} <span>{{ articles | length }}</span></a>
{% endfor %}</p>
{% endblock %}
