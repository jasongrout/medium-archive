<script>
(function () {
  try {
    var font = localStorage.getItem("font");
    if (font === "inter" || font === "noto-sans" || font === "source-sans" ||
        font === "noto-serif" || font === "source-serif")
      document.documentElement.setAttribute("data-font", font);
  } catch (e) {}
})();
</script>
