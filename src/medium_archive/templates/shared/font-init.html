<script>
(function () {
  try {
    var font = localStorage.getItem("font");
    if (font === "sans" || font === "browser" || font === "inter" ||
        font === "source-sans" || font === "atkinson" ||
        font === "ibm-plex-sans" || font === "ibm-plex-serif")
      document.documentElement.setAttribute("data-font", font);
  } catch (e) {}
})();
</script>
