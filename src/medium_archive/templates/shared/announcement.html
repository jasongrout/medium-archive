<script>
(function () {
  var banner = document.querySelector(".announcement");
  var source = banner.getAttribute("data-source");
  var shown = null;
  function dismissed(html) {
    try { return localStorage.getItem("announcement-dismissed") === html; }
    catch (e) { return false; }
  }
  function render(html) {
    html = (html || "").trim();
    if (html === shown) return;
    if (!html || dismissed(html)) {
      banner.hidden = true;
      banner.innerHTML = "";
      shown = null;
      return;
    }
    // .announcement-content (card.css) sets the text size, so bare text
    // and markup render alike
    banner.innerHTML = "";
    var content = document.createElement("div");
    content.className = "announcement-content";
    content.innerHTML = html;
    banner.appendChild(content);
    var close = document.createElement("button");
    close.type = "button";
    close.className = "announcement-close";
    close.setAttribute("aria-label", "Dismiss announcement");
    close.textContent = "×";
    close.addEventListener("click", function () {
      banner.hidden = true;
      try { localStorage.setItem("announcement-dismissed", html); } catch (e) {}
    });
    banner.appendChild(close);
    banner.hidden = false;
    shown = html;
  }
  if (/^https?:\/\//i.test(source)) {
    // Render the cached copy synchronously (this runs before the header
    // is parsed) so the banner does not shift the page; the fetch then
    // updates it.
    var cached = null;
    try { cached = JSON.parse(localStorage.getItem("announcement-cache")); }
    catch (e) {}
    if (cached && cached.src === source) render(cached.html);
    fetch(source).then(function (r) { return r.ok ? r.text() : ""; })
      .then(function (html) {
        try {
          localStorage.setItem("announcement-cache",
                               JSON.stringify({src: source, html: html}));
        } catch (e) {}
        render(html);
      }, function () {});
  } else {
    render(source);
  }
})();
</script>
