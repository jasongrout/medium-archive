<script>
(function () {
  var banner = document.querySelector(".announcement");
  var source = banner.getAttribute("data-source");
  var shown = null;
  function dismissed(html) {
    try { return localStorage.getItem("announcement-dismissed") === html; }
    catch (e) { return false; }
  }
  function render(html) {
    html = (html || "").trim();
    if (html === shown) return;
    if (!html || dismissed(html)) {
      banner.hidden = true;
      banner.innerHTML = "";
      shown = null;
      return;
    }
    banner.innerHTML = html;
    var close = document.createElement("button");
    close.type = "button";
    close.className = "announcement-close";
    close.setAttribute("aria-label", "Dismiss announcement");
    close.textContent = "×";
    close.addEventListener("click", function () {
      banner.hidden = true;
      try { localStorage.setItem("announcement-dismissed", html); } catch (e) {}
    });
    banner.appendChild(close);
    banner.hidden = false;
    shown = html;
  }
  if (/^https?:\/\//i.test(source)) {
    // The last fetch's content renders synchronously (this script runs
    // before the header is parsed), so navigating the site doesn't jerk
    // the page when the banner arrives; the live fetch then corrects
    // the rare case of an announcement that changed since.
    var cached = null;
    try { cached = JSON.parse(localStorage.getItem("announcement-cache")); }
    catch (e) {}
    if (cached && cached.src === source) render(cached.html);
    fetch(source).then(function (r) { return r.ok ? r.text() : ""; })
      .then(function (html) {
        try {
          localStorage.setItem("announcement-cache",
                               JSON.stringify({src: source, html: html}));
        } catch (e) {}
        render(html);
      }, function () {});
  } else {
    render(source);
  }
})();
</script>
