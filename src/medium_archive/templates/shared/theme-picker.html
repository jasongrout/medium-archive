<span class="theme-picker" hidden>
<button type="button">
<svg data-set-theme="light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></svg>
<svg data-set-theme="dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
<svg data-set-theme="system" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"/></svg>
</button>
</span>
<script>
(function () {
  var root = document.documentElement;
  var picker = document.querySelector(".theme-picker");
  var button = picker.querySelector("button");
  var icons = button.querySelectorAll("svg");
  var order = ["light", "dark", "system"];
  var current;
  function apply(choice) {
    current = choice;
    if (choice === "system") root.removeAttribute("data-theme");
    else root.setAttribute("data-theme", choice);
    try {
      if (choice === "system") localStorage.removeItem("theme");
      else localStorage.setItem("theme", choice);
    } catch (e) {}
    icons.forEach(function (icon) {
      icon.style.display = icon.dataset.setTheme === choice ? "" : "none";
    });
    var next = order[(order.indexOf(choice) + 1) % order.length];
    var label = "Color scheme: " + choice + " (switch to " + next + ")";
    button.title = label;
    button.setAttribute("aria-label", label);
  }
  button.addEventListener("click", function () {
    apply(order[(order.indexOf(current) + 1) % order.length]);
  });
  apply(root.getAttribute("data-theme") || "system");
  picker.hidden = false;
})();
</script>
