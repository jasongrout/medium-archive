<style>
/* Backgrounds mirror --bg in card.css / dark-palette.css: redirect
   stubs load no stylesheet, so they paint the palette themselves --
   otherwise following a redirect flashes white in the dark scheme. */
html { background: #f4f4f4; color-scheme: light; }
html[data-theme="dark"] { background: #131313; color-scheme: dark; }
@media (prefers-color-scheme: dark) {
  html:not([data-theme="light"]) { background: #131313; color-scheme: dark; }
}
</style>
