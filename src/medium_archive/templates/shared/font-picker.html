<span class="font-picker" hidden>
<button type="button">
<span class="font-sample" data-set-font="sans">Helvetica</span>
<span class="font-sample" data-set-font="inter">Inter</span>
<span class="font-sample" data-set-font="noto-sans">Noto Sans</span>
<span class="font-sample" data-set-font="source-sans">Source Sans</span>
<span class="font-sample" data-set-font="noto-serif">Noto Serif</span>
<span class="font-sample" data-set-font="source-serif">Source Serif</span>
</button>
</span>
<script>
(function () {
  var root = document.documentElement;
  var picker = document.querySelector(".font-picker");
  var button = picker.querySelector("button");
  var samples = button.querySelectorAll("[data-set-font]");
  var order = ["sans", "inter", "noto-sans", "source-sans", "noto-serif",
               "source-serif"];
  var names = {};
  samples.forEach(function (sample) {
    names[sample.dataset.setFont] = sample.textContent;
  });
  var current;
  function apply(choice) {
    current = choice;
    if (choice === "sans") root.removeAttribute("data-font");
    else root.setAttribute("data-font", choice);
    try {
      if (choice === "sans") localStorage.removeItem("font");
      else localStorage.setItem("font", choice);
    } catch (e) {}
    samples.forEach(function (sample) {
      sample.style.display = sample.dataset.setFont === choice ? "" : "none";
    });
    var next = order[(order.indexOf(choice) + 1) % order.length];
    var label = "Body font: " + names[choice] +
                " (switch to " + names[next] + ")";
    button.title = label;
    button.setAttribute("aria-label", label);
  }
  button.addEventListener("click", function () {
    apply(order[(order.indexOf(current) + 1) % order.length]);
  });
  apply(names[root.getAttribute("data-font")] ? root.getAttribute("data-font")
                                              : "sans");
  picker.hidden = false;
})();
</script>
