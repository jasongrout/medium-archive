<span class="font-picker" hidden>
<select aria-label="Body font">
<option value="sans" style="font-family: var(--sans)">Helvetica</option>
<option value="system-ui" style="font-family: var(--system-ui)">System UI</option>
<option value="inter" style="font-family: var(--inter)">Inter</option>
<option value="source-sans" style="font-family: var(--source-sans)">Source Sans</option>
<option value="source-serif" style="font-family: var(--source-serif)">Source Serif</option>
<option value="atkinson" style="font-family: var(--atkinson)">Atkinson Hyperlegible</option>
<option value="nunito-sans" style="font-family: var(--nunito-sans)">Nunito Sans</option>
<option value="ibm-plex-sans" style="font-family: var(--ibm-plex-sans)">IBM Plex Sans</option>
<option value="ibm-plex-serif" style="font-family: var(--ibm-plex-serif)">IBM Plex Serif</option>
</select>
<svg class="font-picker-arrow" viewBox="0 0 24 24" aria-hidden="true">
<path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round"/>
</svg>
</span>
<script>
(function () {
  var root = document.documentElement;
  var picker = document.querySelector(".font-picker");
  var select = picker.querySelector("select");
  var options = select.options;
  function apply(choice) {
    select.value = choice;
    select.style.fontFamily = options[select.selectedIndex].style.fontFamily;
    if (choice === "sans") root.removeAttribute("data-font");
    else root.setAttribute("data-font", choice);
    try {
      if (choice === "sans") localStorage.removeItem("font");
      else localStorage.setItem("font", choice);
    } catch (e) {}
  }
  select.addEventListener("change", function () {
    apply(select.value);
  });
  var stored = root.getAttribute("data-font");
  var known = false;
  for (var i = 0; i < options.length; i++) {
    if (options[i].value === stored) known = true;
  }
  apply(known ? stored : "sans");
  picker.hidden = false;
})();
</script>
