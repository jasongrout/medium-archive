<script>
(function () {
  function init() {
    // a post carries the bar twice, under the byline and at the foot
    document.querySelectorAll(".share-mastodon").forEach(function (link) {
      link.addEventListener("click", function (event) {
        // a modified click means the reader wants their browser's own
        // behaviour (a new tab, a window); never take it over
        if (event.button || event.metaKey || event.ctrlKey ||
            event.shiftKey || event.altKey) return;
        event.preventDefault();
        var stored = "";
        try { stored = localStorage.getItem("mastodon-host") || ""; } catch (e) {}
        var answer = window.prompt(
          "Your Mastodon server, e.g. fosstodon.org:", stored);
        if (answer === null) return;
        var host = answer.trim()
          .replace(/^https?:\/\//i, "")   // a pasted server URL
          .replace(/\/.*$/, "")
          .replace(/^.*@/, "")            // a pasted @you@server handle
          .toLowerCase();
        // a bare handle ("@you") leaves something that is not a server;
        // navigating to it would fail DNS and poison the stored default
        if (!/^[a-z0-9-]+(\.[a-z0-9-]+)+$/.test(host)) return;
        try { localStorage.setItem("mastodon-host", host); } catch (e) {}
        location.href = "https://" + host + "/share?text=" +
          encodeURIComponent(link.dataset.shareText);
      });
    });
  }
  if (document.readyState === "loading")
    document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
