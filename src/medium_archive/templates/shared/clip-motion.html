<!-- Autoplays a post's clips (mp4s made from gifs and Giphy embeds) while
     on screen, unless the reader prefers reduced motion. A clip the reader
     pauses stays paused (WCAG 2.2.2). Without this script the native
     controls remain. -->
<script>
(function () {
  var reduced = window.matchMedia
    && window.matchMedia("(prefers-reduced-motion: reduce)");
  function init() {
    var post = document.querySelector(".post");
    if (!post || !window.IntersectionObserver) return;
    var clips = Array.prototype.slice.call(post.querySelectorAll("video"));
    if (!clips.length) return;
    function wanted(clip) {
      return clip.dataset.onScreen === "1" && !clip.dataset.held
        && !(reduced && reduced.matches);
    }
    function settle(clip) {
      if (wanted(clip)) {
        var playing = clip.play();
        if (playing && playing.catch) playing.catch(function () {});
      } else if (!clip.paused) {
        clip.dataset.auto = "1";          // ours, not the reader's
        clip.pause();                     // the pause event clears it
      }
    }
    clips.forEach(function (clip) {
      // this script decides playback, so reduced motion is honoured
      clip.removeAttribute("autoplay");
      if (!clip.hasAttribute("controls")) clip.setAttribute("controls", "");
      clip.addEventListener("pause", function () {
        if (clip.dataset.auto) delete clip.dataset.auto;
        else clip.dataset.held = "1";     // the reader's own pause
      });
      clip.addEventListener("play", function () {
        delete clip.dataset.held;
      });
    });
    var seen = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        entry.target.dataset.onScreen = entry.isIntersecting ? "1" : "0";
        settle(entry.target);
      });
    }, { rootMargin: "200px 0px" });
    clips.forEach(function (clip) { seen.observe(clip); });
    if (reduced && reduced.addEventListener)
      reduced.addEventListener("change", function () {
        clips.forEach(settle);
      });
  }
  if (document.readyState === "loading")
    document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
