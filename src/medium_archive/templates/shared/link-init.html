<script>
(function () {
  try {
    var link = localStorage.getItem("link");
    if (link === "orange-dark" || link === "petrol" || link === "blue" ||
        link === "link-blue" || link === "petrol-aaa" ||
        link === "browser")
      document.documentElement.setAttribute("data-link", link);
  } catch (e) {}
})();
</script>
