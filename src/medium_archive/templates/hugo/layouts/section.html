{{ define "main" }}
<h1 class="page-title">{{ .Title }}
{{- with .OutputFormats.Get "rss" }}<a class="feed-link" href="{{ .RelPermalink }}" aria-label="RSS feed for {{ $.Title }}" title="RSS feed for {{ $.Title }}">
<!-- @include shared/feed-icon.html -->
</a>{{ end }}</h1>
{{ .Content }}
{{ $paginator := partial "paginator.html" . }}
<div class="card-grid">
{{ range $paginator.Pages }}{{ partial "card.html" . }}{{ end }}
</div>
{{ partial "pagination.html" . }}
{{ end }}
