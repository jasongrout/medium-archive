{{/* One year's posts at /posts/<year>/; same markup as archives.html
     and the Pelican site's period_archives.html. */}}
{{ define "main" }}
<h1 class="page-title">Posts from {{ .Title }}</h1>
<ul class="archives">
{{ range .RegularPages.ByDate.Reverse }}<li><time>{{ .Date.Format "2006-01-02" }}</time> <a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
{{ end }}</ul>
<p><a href="{{ "/archives/" | relURL }}">All posts by year</a></p>
{{ end }}
