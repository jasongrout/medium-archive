{{- /* Up to three other posts, ranked by [related] in hugo.toml.
       Ignored by Pagefind, since the text belongs to other posts. */ -}}
{{- with (where site.RegularPages "Type" "posts").Related . | first 3 }}
<section class="related" data-pagefind-ignore>
<h2 class="page-title">More posts</h2>
<div class="card-grid">
{{ range . }}{{ partial "card.html" . }}{{ end }}
</div>
</section>
{{- end }}
