{{- /* Share bar, rendered twice per post; the icons reference the
       sprite that page.html includes once (shared/share-icons.html).
       Hugo's contextual escaper encodes the title and URL for each
       href. */ -}}
{{- $text := printf "%s %s" .Title .Permalink -}}
<div class="post-share" data-pagefind-ignore>
<span class="share-label">Share</span>
<a class="share-link" href="https://www.linkedin.com/sharing/share-offsite/?url={{ .Permalink }}" aria-label="Share on LinkedIn" title="Share on LinkedIn"><svg class="share-icon" aria-hidden="true"><use href="#share-linkedin"></use></svg></a>
<a class="share-link" href="https://www.facebook.com/sharer/sharer.php?u={{ .Permalink }}" aria-label="Share on Facebook" title="Share on Facebook"><svg class="share-icon" aria-hidden="true"><use href="#share-facebook"></use></svg></a>
<a class="share-link" href="https://bsky.app/intent/compose?text={{ $text }}" aria-label="Share on Bluesky" title="Share on Bluesky"><svg class="share-icon" aria-hidden="true"><use href="#share-bluesky"></use></svg></a>
<a class="share-link" href="https://share.joinmastodon.org/#text={{ $text }}" aria-label="Share on Mastodon" title="Share on Mastodon"><svg class="share-icon" aria-hidden="true"><use href="#share-mastodon"></use></svg></a>
<a class="share-link" href="mailto:?subject={{ .Title }}&amp;body={{ .Permalink }}" aria-label="Share by email" title="Share by email"><svg class="share-icon" aria-hidden="true"><use href="#share-email"></use></svg></a>
</div>
