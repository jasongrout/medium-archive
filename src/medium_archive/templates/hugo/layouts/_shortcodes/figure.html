{{- /* Captioned body image: the image through post-image.html, like
       the render hook, and the inner content as an inline caption (no
       <p>). Replaces Hugo's built-in figure, which ignores inner
       content. */ -}}
<figure>
{{ with .Get "link" }}<a href="{{ . }}">{{ end }}{{- partial "post-image.html" (dict "page" .Page "src" (.Get "src") "alt" (.Get "alt" | default "")) -}}{{ with .Get "link" }}</a>{{ end }}
{{- with trim .Inner "\n" }}
<figcaption>{{ . | $.Page.RenderString }}</figcaption>
{{- end }}
</figure>
